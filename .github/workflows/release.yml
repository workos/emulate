name: Release

on:
  workflow_call:
    inputs:
      tag_name:
        description: Release tag name (e.g., v0.12.0-beta.1)
        type: string
        default: ''
    secrets:
      SDK_BOT_PRIVATE_KEY:
        description: Private key for the org SDK bot GitHub App, used to mint a short-lived token scoped to workos/homebrew-tap
        required: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      # npm publish --provenance (OIDC trusted publishing) is the deliberate
      # npm exception to the Bun conversion — setup-node configures the registry.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Determine npm tag
        id: npm-tag
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          VERSION="${TAG_NAME#v}"

          if [[ -z "$VERSION" ]]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi

          if [[ "$VERSION" == *"-"* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        run: |
          sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          unset NODE_AUTH_TOKEN
          npm publish --tag ${{ steps.npm-tag.outputs.tag }} --access public --provenance

  binaries:
    name: Upload release binaries
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write # required for gh release upload
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build binaries
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: scripts/build-binaries.sh "$TAG_NAME"

      - name: Upload binaries to the release-please release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: gh release upload "$TAG_NAME" dist/binaries/* --clobber

  homebrew:
    name: Update Homebrew formula
    runs-on: ubuntu-latest
    needs: binaries
    # Homebrew only ships stable releases; prerelease tags (v1.2.3-beta.1) skip the bump.
    if: ${{ !contains(inputs.tag_name, '-') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Mints an installation token scoped to the tap repo; owner/repositories
      # target homebrew-tap rather than this repo, and contents:write is all a
      # formula push needs. The step fails loudly if the app id/key are absent.
      - name: Generate a tap-scoped token
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SDK_BOT_APP_ID }}
          private-key: ${{ secrets.SDK_BOT_PRIVATE_KEY }}
          owner: workos
          repositories: homebrew-tap
          permission-contents: write

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: workos/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: homebrew-tap

      # Re-download the checksums from the release itself so the formula is
      # guaranteed to describe the binaries users will actually download.
      - name: Download checksums from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: gh release download "$TAG_NAME" --pattern checksums.txt --dir dist/binaries

      - name: Update formula and push
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          scripts/update-homebrew-formula.sh "$TAG_NAME" dist/binaries/checksums.txt homebrew-tap/Formula/workos-emulate.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/workos-emulate.rb
          if git diff --staged --quiet; then
            echo "Formula already up to date for ${TAG_NAME}; nothing to push"
          else
            git commit -m "workos-emulate ${TAG_NAME}"
            git push
          fi
