name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Verify npm pack contents match baseline
        run: diff <(LC_ALL=C sort scripts/pack-baseline.txt) <(npm pack --json | jq -r '.[0].files[].path' | LC_ALL=C sort)

      - name: Binary smoke test
        run: scripts/smoke-binary.sh

      - name: Cross-compile dry-run (all release targets)
        run: |
          for target in bun-darwin-arm64 bun-darwin-x64 bun-linux-x64 bun-linux-arm64 bun-windows-x64; do
            bun build --compile --target="$target" ./src/cli.ts --outfile "/tmp/xc/workos-emulate-$target"
          done

  node-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22 # engines floor — the oldest Node we claim to support

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Node library smoke test
        run: node scripts/smoke-node.mjs
