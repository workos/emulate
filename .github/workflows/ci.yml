name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # Node is still a supported runtime and npm pack is part of the release
      # contract. Pin both rather than relying on the runner image defaults.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      # The spec-derived catalogs under src/workos/generated are committed so consumers
      # never need the spec, which means a @workos/openapi-spec bump does not update them
      # on its own — and the conformance tests would go on asserting the previous spec's
      # contract. Regenerate here and fail if anything moved, so a bump PR has to carry
      # the regenerated catalogs (and any conformance fallout) with it.
      - name: Check spec codegen is up to date
        run: |
          bun run gen:events
          bun run gen:shapes
          if ! git diff --exit-code -- src/workos/generated; then
            echo "::error::Generated spec catalogs are stale. Run 'bun run gen:events && bun run gen:shapes' and commit the result."
            exit 1
          fi

      # SUPPORTED.md is derived from the spec, the registered routes, and the
      # EmulatorSeedConfig keys, so it goes stale whenever any of the three moves —
      # including when a route is added, which no spec bump would catch. The generator
      # also fails outright on a spec tag that no feature claims, so a new WorkOS
      # product cannot silently drop out of the table.
      - name: Check support matrix is up to date
        run: |
          bun run gen:supported
          if ! git diff --exit-code -- SUPPORTED.md; then
            echo "::error::SUPPORTED.md is stale. Run 'bun run gen:supported' and commit the result."
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Verify packed npm package
        run: node scripts/check-package.mjs

      - name: Binary smoke test
        run: scripts/smoke-binary.sh

      - name: Cross-compile all release targets
        run: |
          scripts/build-binaries.sh v0.0.0-ci
          test "$(wc -l < dist/binaries/checksums.txt | tr -d ' ')" -eq 8
          (cd dist/binaries && shasum -a 256 -c checksums.txt)

      - name: Validate generated Homebrew formula
        run: |
          scripts/update-homebrew-formula.sh v0.0.0 dist/binaries/checksums.txt /tmp/workos-emulate.rb
          ruby -c /tmp/workos-emulate.rb

  node-smoke:
    name: Node ${{ matrix.node }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Node library compatibility suite
        run: node scripts/smoke-node.mjs

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: emulate:ci

      - name: Container smoke test
        shell: bash
        run: |
          docker run --rm -d -p 4100:4100 --name emulate-ci emulate:ci
          trap 'docker stop emulate-ci 2>/dev/null || true' EXIT
          # `--retry-all-errors` retries on TCP reset (curl 56) too, not just
          # connection-refused (curl 7). The container is created before the
          # Node app finishes binding :4100, so the first probe can hit a RST.
          curl --retry 10 --retry-delay 1 --retry-all-errors --fail http://localhost:4100/health

  docker-arm64:
    name: Docker build (arm64)
    # Native ARM runner — builds the arm64 image the release workflow publishes
    # to GHCR, without QEMU emulation. Mirrors `docker` above on ubuntu-24.04-arm
    # (the same runner the standalone-binary smoke tests use for arm64).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: emulate:ci

      - name: Container smoke test
        shell: bash
        run: |
          docker run --rm -d -p 4100:4100 --name emulate-ci emulate:ci
          trap 'docker stop emulate-ci 2>/dev/null || true' EXIT
          # `--retry-all-errors` retries on TCP reset (curl 56) too, not just
          # connection-refused (curl 7). The container is created before the
          # Node app finishes binding :4100, so the first probe can hit a RST.
          curl --retry 10 --retry-delay 1 --retry-all-errors --fail http://127.0.0.1:4100/health
