name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # Node is still a supported runtime and npm pack is part of the release
      # contract. Pin both rather than relying on the runner image defaults.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      # The spec-derived catalogs under src/workos/generated are committed so consumers
      # never need the spec, which means a @workos/openapi-spec bump does not update them
      # on its own — and the conformance tests would go on asserting the previous spec's
      # contract. Regenerate here and fail if anything moved, so a bump PR has to carry
      # the regenerated catalogs (and any conformance fallout) with it.
      - name: Check spec codegen is up to date
        run: |
          bun run gen:events
          bun run gen:shapes
          if ! git diff --exit-code -- src/workos/generated; then
            echo "::error::Generated spec catalogs are stale. Run 'bun run gen:events && bun run gen:shapes' and commit the result."
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Verify packed npm package
        run: node scripts/check-package.mjs

      - name: Binary smoke test
        run: scripts/smoke-binary.sh

      - name: Cross-compile all release targets
        run: |
          scripts/build-binaries.sh v0.0.0-ci
          test "$(wc -l < dist/binaries/checksums.txt | tr -d ' ')" -eq 8
          (cd dist/binaries && shasum -a 256 -c checksums.txt)

      - name: Validate generated Homebrew formula
        run: |
          scripts/update-homebrew-formula.sh v0.0.0 dist/binaries/checksums.txt /tmp/workos-emulate.rb
          ruby -c /tmp/workos-emulate.rb

  node-smoke:
    name: Node ${{ matrix.node }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Node library compatibility suite
        run: node scripts/smoke-node.mjs
